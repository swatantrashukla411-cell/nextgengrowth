<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Credential | NextGenGrowth</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #047857;
      --primary-light: #ecfdf5;
      --ink-900: #0a1f17;
      --ink-700: #1f3a2e;
      --ink-500: #4b6358;
      --border: rgba(16, 185, 129, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f6fbf8;
      color: var(--ink-900);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .verify-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 22px;
      max-width: 580px;
      width: 100%;
      padding: 36px;
      box-shadow: 0 20px 50px rgba(10, 31, 23, 0.08);
    }
    .brand-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .brand-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; }
    .brand-logo img { height: 32px; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 18px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eef4f1;
      font-size: 0.92rem;
    }
    .row-label { color: var(--ink-500); font-weight: 600; }
    .row-val { color: var(--ink-900); font-weight: 700; text-align: right; }
    .mono { font-family: 'JetBrains Mono', monospace; color: var(--primary-dark); }
  </style>
</head>
<body>
  <div class="verify-card" id="verify-root">
    <div class="brand-head">
      <div class="brand-logo">
        <img src="/android-chrome-512x512.png" alt="NextGenGrowth" style="border-radius: 50%;" onerror="this.src='/logo.png'" />
        <span>NextGenGrowth Registry</span>
      </div>
      <span class="mono" style="font-size: 0.78rem;">UDYAM-UP-48-0068269</span>
    </div>
    <div id="verify-content" style="text-align: center; padding: 24px 0; color: var(--ink-500);">
      Verifying credential in MongoDB Atlas...
    </div>
  </div>

  <script>
    async function verifyCert() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const certId = parts[parts.length - 1];
      const container = document.getElementById('verify-content');

      try {
        const res = await fetch(`/api/certificates/verify/${encodeURIComponent(certId)}`);
        const data = await res.json();

        const esc = (v) => String(v || '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

        if (!data.success || !data.certificate) {
          container.innerHTML = `
            <div style="font-size: 2rem; margin-bottom: 10px;">⚠️</div>
            <h2 style="margin-bottom: 8px; color: #b91c1c;">Credential Not Found</h2>
            <p style="font-size: 0.9rem;">No active certificate matches ID <strong>${esc(certId)}</strong>.</p>
          `;
          return;
        }

        const c = data.certificate;
        const issuedDate = new Date(c.issuedAt).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
        const docTitle = c.type === 'lor' ? 'Letter of Recommendation (LOR)' : (c.certTitle || 'Certificate of Appreciation');
        container.style.textAlign = 'left';
        container.innerHTML = `
          <div class="status-badge">✅ Officially Verified Credential</div>
          <h1 style="font-size: 1.65rem; font-weight: 800; margin-bottom: 4px;">${esc(c.studentName)}</h1>
          ${c.college ? `<p style="color: var(--ink-500); font-size: 0.92rem; margin-bottom: 20px;">${esc(c.college)}</p>` : '<div style="margin-bottom: 16px;"></div>'}

          <div class="row"><span class="row-label">Credential ID</span><span class="row-val mono">${esc(c.certificateId)}</span></div>
          <div class="row"><span class="row-label">Document Type</span><span class="row-val">${esc(docTitle)}</span></div>
          <div class="row"><span class="row-label">Work / Department</span><span class="row-val">${esc(c.role)}</span></div>
          ${c.duration ? `<div class="row"><span class="row-label">Duration / Year</span><span class="row-val">${esc(c.duration)}</span></div>` : ''}
          <div class="row"><span class="row-label">Verified Sprints</span><span class="row-val">${esc(c.projectsCompleted || 1)} Verified Contribution(s)</span></div>
          <div class="row"><span class="row-label">Issued Date</span><span class="row-val">${esc(issuedDate)}</span></div>
          <div class="row"><span class="row-label">Issuing MSME</span><span class="row-val mono">${esc(c.msmeRegNo)}</span></div>
          <div class="row" style="border-bottom: none;"><span class="row-label">Authorized By</span><span class="row-val">${esc(c.issuedBy)} (Founder)</span></div>

          <div style="margin-top: 22px; background: var(--primary-light); padding: 14px; border-radius: 12px; font-size: 0.82rem; color: var(--primary-dark);">
            For HR background verification inquiries, email <strong>verify@nextgengrowth.in</strong> referencing ID <strong>${c.certificateId}</strong>.
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<p style="color: #b91c1c;">Verification service unavailable.</p>`;
      }
    }
    verifyCert();
  </script>
</body>
</html>
